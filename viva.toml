[app]
name = "JarLens"
id = "io.github.xddcode.jarlens"
version = "0.2.1"
executable = "jarlens"
package = "./cmd/jarlens"
icon = "assets/app-icon.png"

[build]
out = "build/dist"

[mac]
category = "public.app-category.developer-tools"
copyright = "JarLens contributors"

[windows]
publisher = "JarLens contributors"

[linux]
category = "Development"
comment = "Native Java decompiler and code explorer"
keywords = ["java", "decompiler", "bytecode", "jar"]
