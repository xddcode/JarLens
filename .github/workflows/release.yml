name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and annotated notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check update signing key
        env:
          VIVA_UPDATE_KEY: ${{ secrets.VIVA_UPDATE_KEY }}
        run: |
          if [ -z "$VIVA_UPDATE_KEY" ]; then
            echo "::error::VIVA_UPDATE_KEY is required to sign the automatic-update feed"
            exit 1
          fi
      - name: Check tag, version, and notes
        run: |
          app_version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' viva.toml | head -1)
          version=${GITHUB_REF_NAME#v}
          notes="docs/releases/$version.md"
          case "$GITHUB_REF_NAME" in
            "v$app_version" | "v$app_version"-*) ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME does not match viva.toml version $app_version or its prerelease"
              exit 1
              ;;
          esac
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/tag-notes.md"
          python3 - "$notes" "$RUNNER_TEMP/tag-notes.md" <<'EOF'
          import sys

          def normalized(path):
              with open(path, encoding="utf-8") as source:
                  return "\n".join(source.read().splitlines()).strip() + "\n"

          if normalized(sys.argv[1]) != normalized(sys.argv[2]):
              raise SystemExit("annotated tag message does not match committed release notes")
          EOF

  package:
    name: Package ${{ matrix.variant }} ${{ matrix.target }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: standard, os: windows-latest, target: windows, arch: amd64, format: zip }
          - { variant: standard, os: windows-latest, target: windows, arch: arm64, format: zip }
          - { variant: standard, os: macos-15, target: darwin, arch: amd64, format: zip }
          - { variant: standard, os: macos-15, target: darwin, arch: arm64, format: zip }
          - { variant: standard, os: ubuntu-24.04, target: linux, arch: amd64, format: tar.gz }
          - { variant: standard, os: ubuntu-24.04, target: linux, arch: arm64, format: tar.gz }
          - { variant: portable, os: windows-latest, target: windows, arch: amd64, format: "zip,nsis" }
          - { variant: portable, os: windows-latest, target: windows, arch: arm64, format: "zip,nsis" }
          - { variant: portable, os: macos-15, target: darwin, arch: amd64, format: "zip,dmg" }
          - { variant: portable, os: macos-15, target: darwin, arch: arm64, format: "zip,dmg" }
          - { variant: portable, os: ubuntu-24.04, target: linux, arch: amd64, format: "tar.gz,deb" }
          - { variant: portable, os: ubuntu-24.04, target: linux, arch: arm64, format: "tar.gz,deb" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install NSIS for the portable Windows installer
        if: matrix.variant == 'portable' && matrix.target == 'windows'
        shell: bash
        run: choco install nsis --no-progress -y
      - name: Test before packaging
        run: go test ./... -count=1
      - name: Package without claiming a signature
        shell: bash
        run: |
          package_out="$RUNNER_TEMP/package"
          if [ "${{ matrix.target }}" = "darwin" ]; then
            package_out="$RUNNER_TEMP/package/JarLens.app"
          fi
          go tool viva package --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" \
            --format "${{ matrix.format }}" --no-sign --out "$package_out"
          version=${GITHUB_REF_NAME#v}
          suffix=""
          if [ "${{ matrix.variant }}" = "portable" ]; then suffix="-portable"; fi
          mkdir -p "$RUNNER_TEMP/upload"
          src=$(find "$RUNNER_TEMP/package" -maxdepth 1 -type f | sort)
          if [ -z "$src" ]; then
            echo "::error::no packages were produced"
            exit 1
          fi
          printf '%s\n' "$src" | while read -r source; do
            case "$source" in
              *.deb)
                destination="$RUNNER_TEMP/upload/jarlens${suffix}_${version}_${{ matrix.arch }}.deb"
                ;;
              *-setup.exe)
                destination="$RUNNER_TEMP/upload/jarlens-$version-${{ matrix.target }}-${{ matrix.arch }}-setup.exe"
                ;;
              *.tar.gz)
                destination="$RUNNER_TEMP/upload/jarlens-$version-${{ matrix.target }}-${{ matrix.arch }}$suffix.tar.gz"
                ;;
              *)
                destination="$RUNNER_TEMP/upload/jarlens-$version-${{ matrix.target }}-${{ matrix.arch }}$suffix.${source##*.}"
                ;;
            esac
            mv "$source" "$destination"
            echo "destination=$destination" >> "$GITHUB_ENV"
          done
      - name: Bundle the managed JRE for the standard variant
        if: matrix.variant == 'standard'
        shell: bash
        run: |
          python3 tools/runtime.py download -os "${{ matrix.target }}" -arch "${{ matrix.arch }}" -out "$RUNNER_TEMP/runtime"
          python3 tools/runtime.py bundle -archive "$destination" -runtime "$RUNNER_TEMP/runtime/jre" -target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.variant }}-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error

  publish:
    name: Verify and publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Add notices and source dependency SBOM
        run: |
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/release/"
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/release/jarlens-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the automatic-update feed
        shell: bash
        env:
          VIVA_UPDATE_KEY: ${{ secrets.VIVA_UPDATE_KEY }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Skipping stable automatic-update feeds for a prerelease"
            exit 0
          fi
          go tool viva feed -dir "$RUNNER_TEMP/release" \
            -base-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download" \
            -channel stable \
            -notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          go tool viva feed -dir "$RUNNER_TEMP/release" \
            -out "$RUNNER_TEMP/release/cnb-latest.json" \
            -base-url "https://cnb.cool/xddcode/JarLens/-/releases/download/${GITHUB_REF_NAME}" \
            -channel stable \
            -notes "https://cnb.cool/xddcode/JarLens/-/releases/tag/${GITHUB_REF_NAME}"
          JARLENS_UPDATE_FEED_DIR="$RUNNER_TEMP/release" go test ./internal/update -run '^TestPublishedFeedSignature$' -count=1
      - name: Checksum the complete artifact set
        shell: bash
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create draft and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "JarLens $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$version.md"
          cd "$RUNNER_TEMP/release"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" *
      - name: Verify remote assets before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          find . -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/expected-assets"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Start CNB release synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-to-cnb.yaml --repo "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
